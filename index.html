<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none';">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9FC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316">
  <meta name="description" content="Analītisks 7 dienu horoskops Svariem un Vēzim ar galvenajiem + un -.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Horoskops — Svari & Vēzis</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="title-group">
        <h1 id="headerSignTitle">Svari</h1>
        <p id="headerSubtitle">Praktiskā nedēļas prognoze</p>
      </div>
      <button type="button" class="icon-btn" id="refreshBtn" aria-label="Atjaunot prognozi" title="Atjaunot skatījumu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </header>

    <div class="week-strip" role="tablist" aria-label="Tuvākās 7 dienas" id="weekStrip"></div>

    <div class="ptr-indicator" id="ptrIndicator" aria-hidden="true">Atlaidiet, lai atjaunotu…</div>

    <main class="content-area" id="mainContent">
      <article class="forecast-card" id="forecastPanel" role="tabpanel" aria-live="polite"></article>
    </main>

    <nav class="bottom-nav" aria-label="Zodiaka zīmes">
      <button type="button" class="nav-item" id="navSvari" data-sign="svari" aria-current="page">
        <span class="nav-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19h16v2H4v-2zm16-4h-4.17c.72-.88 1.17-2 1.17-3.22C17 8.98 14.76 6.75 12 6.75S7 8.98 7 11.78c0 1.22.45 2.34 1.17 3.22H4v2h6.5v-1.64c-.9-.56-1.5-1.56-1.5-2.69 0-1.74 1.35-3.15 3-3.15s3 1.41 3 3.15c0 1.13-.6 2.13-1.5 2.69V17H20v-2z"/>
          </svg>
        </span>
        <span class="nav-label">Svari</span>
      </button>

      <button type="button" class="nav-item" id="navVezis" data-sign="vezis">
        <span class="nav-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4C4.5 4 2.2 6.1 2 9h2.05c.2-1.75 1.65-3 3.45-3 1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2H3.5c0 2.21 1.79 4 4 4zm9 2c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5c3 0 5.3-2.1 5.5-5h-2.05c-.2 1.75-1.65 3-3.45 3-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2h2.05c0-2.21-1.79-4-4-4z"/>
          </svg>
        </span>
        <span class="nav-label">Vēzis</span>
      </button>
    </nav>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
