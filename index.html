    :root {
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --surface-container: #ECEFF5;
      --surface-container-high: #DFE5EF;
      --on-surface: #191C20;
      --on-surface-variant: #43474E;
      --outline-variant: #C3C6CF;
      --primary: #2B3039;
      --on-primary: #FFFFFF;
      --secondary-container: #DFE5EF;
      --on-secondary-container: #161C24;

      --pos-container: #E3F3E8;
      --on-pos-container: #0D381E;
      --pos-badge: #1E6E3E;
      --neg-container: #FCEAE8;
      --on-neg-container: #410E0B;
      --neg-badge: #B3261E;

      --nav-height: 76px;
      --radius-lg: 24px;
      --radius-pill: 999px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --surface: #1B1D21;
        --surface-container: #23262B;
        --surface-container-high: #2E3239;
        --on-surface: #E2E2E6;
        --on-surface-variant: #C3C6CF;
        --outline-variant: #43474E;
        --primary: #DFE5EF;
        --on-primary: #191C20;
        --secondary-container: #333944;
        --on-secondary-container: #DFE5EF;

        --pos-container: #172E21;
        --on-pos-container: #BCEBCE;
        --pos-badge: #7AD69E;
        --neg-container: #361B1A;
        --on-neg-container: #F9DEDC;
        --neg-badge: #F2B8B5;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior-y: contain;
      background-color: var(--bg);
      color: var(--on-surface);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top, 0px);
    }

    header.top-bar {
      padding: 14px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .title-group h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .title-group p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--on-surface-variant);
      font-weight: 500;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--surface-container);
      color: var(--on-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 8px 14px 12px;
      flex-shrink: 0;
    }

    .day-tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--on-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 2px;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.12s ease;
    }

    .day-tab:active {
      transform: scale(0.94);
    }

    .day-tab .dow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      margin-bottom: 6px;
    }

    .day-tab .dom {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .day-tab[aria-selected="true"] {
      background: var(--surface-container);
    }

    .day-tab[aria-selected="true"] .dow {
      color: var(--on-surface);
      font-weight: 700;
    }

    .day-tab[aria-selected="true"] .dom {
      background: var(--primary);
      color: var(--on-primary);
    }

    .ptr-indicator {
      height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-variant);
      transition: height 0.2s ease;
    }

    main.content-area {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 20px);
      touch-action: pan-y;
      contain: content;
    }

    article.forecast-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeSlide 0.22s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0.4; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summary-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
    }

    .summary-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .date-pill {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--on-secondary-container);
      background: var(--secondary-container);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .focus-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-variant);
    }

    .summary-text {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.55;
      color: var(--on-surface);
    }

    .tonal-box {
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }

    .tonal-box.positive {
      background: var(--pos-container);
      color: var(--on-pos-container);
    }

    .tonal-box.negative {
      background: var(--neg-container);
      color: var(--on-neg-container);
    }

    .tonal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .badge-symbol {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: var(--surface);
    }

    .positive .badge-symbol {
      background: var(--pos-badge);
    }

    .negative .badge-symbol {
      background: var(--neg-badge);
    }

    .point-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .point-list li {
      font-size: 14.5px;
      line-height: 1.48;
      padding-left: 14px;
      position: relative;
    }

    .point-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      font-weight: 700;
      opacity: 0.75;
    }

    .skeleton {
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, var(--surface-container) 25%, var(--surface-container-high) 50%, var(--surface-container) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
    }

    .skeleton-summary { height: 132px; }
    .skeleton-box { height: 148px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--surface-container);
      border-top: 1px solid color-mix(in srgb, var(--outline-variant) 35%, transparent);
      display: grid;
      grid-template-columns: 1fr 1fr;
      z-index: 10;
    }

    .nav-item {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--on-surface-variant);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 0;
    }

    .nav-pill {
      width: 64px;
      height: 32px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .nav-item[aria-current="page"] .nav-pill {
      background: var(--primary);
      color: var(--on-primary);
    }

    .nav-item[aria-current="page"] .nav-label {
      color: var(--on-surface);
      font-weight: 700;
    }

    .nav-pill svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 600;
    }
</style>

            summary: 'Labvēlīga diena atslodzei no pienākumiem. Vislabāk jutīsieties pazīstamā vidē vai dabā, izvairoties no trokšņainiem pasākumiem.',

          {
            focus: 'Sagatavošanās un struktūra',
            summary: 'Diena piemērota kārtības ieviešanai gan domās, gan praktiskajās lietās pirms jaunās darba nedēļas sākuma.',
            plus: [
              { key: 'Pārdomāta stratēģija:', text: 'Skaidri redzēsiet, kam veltīt uzmanību nākamajās dienās.' },

            ],
            minus: [
              { key: 'Lieka trauksme par nākotni:', text: 'Koncentrējieties tikai uz rītdienas pirmo soli.' },

      });

      // Safe Storage wrapper (prevents crashes in strict privacy / incognito modes)
      let memorySign = 'svari';
      function readStoredSign() {
        try {
          const val = window.localStorage.getItem('horoscope_sign');
          if (val === 'svari' || val === 'vezis') {
            memorySign = val;
          }
        } catch (_) {}
        return memorySign;
      }

      function writeStoredSign(sign) {
        if (sign !== 'svari' && sign !== 'vezis') return;
        memorySign = sign;
        try {
          window.localStorage.setItem('horoscope_sign', sign);
        } catch (_) {}
      }

      let currentSign = readStoredSign();
      let selectedDayOffset = 0;
      let variationSeed = 0;

      const headerSignTitle = document.getElementById('headerSignTitle');
      const headerSubtitle = document.getElementById('headerSubtitle');
      const weekStrip = document.getElementById('weekStrip');
      const forecastPanel = document.getElementById('forecastPanel');
      const mainContent = document.getElementById('mainContent');
      const ptrIndicator = document.getElementById('ptrIndicator');
      const refreshBtn = document.getElementById('refreshBtn');
      const navButtons = document.querySelectorAll('.nav-item');

      function getDateObj(offset) {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + offset);
        return d;
      }

      function getForecastForDay(sign, offset) {
        const d = getDateObj(offset);
        const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
        const list = Object.prototype.hasOwnProperty.call(DATA_BANK, sign) ? DATA_BANK[sign] : DATA_BANK.svari;
        const idx = (dayOfYear + variationSeed) % list.length;
        return list[idx];
      }

      function renderWeekStrip() {
        weekStrip.replaceChildren();
        for (let i = 0; i < 7; i++) {
          const d = getDateObj(i);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day-tab';
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', i === selectedDayOffset ? 'true' : 'false');
          btn.setAttribute('aria-label', `${DAYS_FULL[d.getDay()]}, ${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`);
          btn.dataset.offset = String(i);

          const dow = document.createElement('span');
          dow.className = 'dow';
          dow.textContent = i === 0 ? 'ŠOD' : DAYS_SHORT[d.getDay()];

          const dom = document.createElement('span');
          dom.className = 'dom';
          dom.textContent = String(d.getDate());

          btn.append(dow, dom);
          btn.addEventListener('click', () => selectDay(i));
          weekStrip.appendChild(btn);
        }
      }

      function renderSkeleton() {
        forecastPanel.replaceChildren();
        const s1 = document.createElement('div');
        s1.className = 'skeleton skeleton-summary';

        const s2 = document.createElement('div');
        s2.className = 'skeleton skeleton-box';

        const s3 = document.createElement('div');
        s3.className = 'skeleton skeleton-box';

        forecastPanel.append(s1, s2, s3);
      }

      function renderForecast() {
        const d = getDateObj(selectedDayOffset);
        const data = getForecastForDay(currentSign, selectedDayOffset);

        headerSignTitle.textContent = currentSign === 'svari' ? 'Svari' : 'Vēzis';
        headerSubtitle.textContent = `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]} • ${DAYS_FULL[d.getDay()]}`;

        forecastPanel.replaceChildren();

        const summaryCard = document.createElement('section');
        summaryCard.className = 'summary-card';

        const summaryMeta = document.createElement('div');
        summaryMeta.className = 'summary-meta';

        const datePill = document.createElement('span');
        datePill.className = 'date-pill';
        datePill.textContent = selectedDayOffset === 0 ? 'Šodien' : (selectedDayOffset === 1 ? 'Rīt' : `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]}`);

        const focusTag = document.createElement('span');
        focusTag.className = 'focus-tag';
        focusTag.textContent = data.focus;

        summaryMeta.append(datePill, focusTag);

        const summaryText = document.createElement('p');
        summaryText.className = 'summary-text';
        summaryText.textContent = data.summary;

        summaryCard.append(summaryMeta, summaryText);

        const posBox = buildTonalBox('positive', '+', 'Galvenie + (Iespējas)', data.plus);
        const negBox = buildTonalBox('negative', '−', 'Galvenie − (Riski)', data.minus);

        forecastPanel.append(summaryCard, posBox, negBox);
      }

      function buildTonalBox(type, symbol, title, items) {
        const box = document.createElement('section');
        box.className = `tonal-box ${type}`;

        const header = document.createElement('div');
        header.className = 'tonal-header';

        const badge = document.createElement('span');
        badge.className = 'badge-symbol';
        badge.setAttribute('aria-hidden', 'true');
        badge.textContent = symbol;

        const heading = document.createElement('span');
        heading.textContent = title;

        header.append(badge, heading);

        const ul = document.createElement('ul');
        ul.className = 'point-list';

        items.forEach((item) => {
          const li = document.createElement('li');
          const strong = document.createElement('strong');
          strong.textContent = item.key + ' ';
          const span = document.createElement('span');
          span.textContent = item.text;
          li.append(strong, span);
          ul.appendChild(li);
        });

        box.append(header, ul);
        return box;
      }

      function selectDay(offset) {
        if (!Number.isInteger(offset) || offset < 0 || offset > 6) return;
        selectedDayOffset = offset;
        renderWeekStrip();
        renderForecast();
      }

      function selectSign(sign) {
        if ((sign !== 'svari' && sign !== 'vezis') || sign === currentSign) return;
        currentSign = sign;
        writeStoredSign(sign);
        navButtons.forEach((btn) => {
          if (btn.dataset.sign === sign) {
            btn.setAttribute('aria-current', 'page');
          } else {
            btn.removeAttribute('aria-current');
          }
        });
        renderForecast();
      }

      function triggerRefresh() {
        variationSeed = (variationSeed + 1) % 7;
        renderSkeleton();
        window.setTimeout(() => {
          renderForecast();
        }, 260);
      }

      navButtons.forEach((btn) => {
        btn.addEventListener('click', () => selectSign(btn.dataset.sign));
      });

      refreshBtn.addEventListener('click', triggerRefresh);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && selectedDayOffset < 6) {
          selectDay(selectedDayOffset + 1);
        } else if (e.key === 'ArrowLeft' && selectedDayOffset > 0) {
          selectDay(selectedDayOffset - 1);
        }
      });

      let touchStartX = 0;
      let touchStartY = 0;
      let isPulling = false;

      mainContent.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isPulling = mainContent.scrollTop === 0;
      }, { passive: true });

      mainContent.addEventListener('touchmove', (e) => {
        if (!isPulling || e.touches.length !== 1) return;
        const dy = e.touches[0].clientY - touchStartY;
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        if (dy > 20 && dy > dx) {
          ptrIndicator.style.height = `${Math.min(44, dy * 0.45)}px`;
          ptrIndicator.textContent = dy > 85 ? 'Atlaidiet, lai atjaunotu…' : 'Velciet uz leju, lai atjaunotu';
        }
      }, { passive: true });

      mainContent.addEventListener('touchend', (e) => {
        if (e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;

        if (ptrIndicator.style.height && ptrIndicator.style.height !== '0px') {
          ptrIndicator.style.height = '0px';
          if (isPulling && dy > 85 && Math.abs(dx) < 60) {
            triggerRefresh();
            isPulling = false;
            return;
          }
        }
        isPulling = false;

        if (touchStartX > 32 && touchStartX < window.innerWidth - 32) {
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            if (dx < 0 && selectedDayOffset < 6) {
              selectDay(selectedDayOffset + 1);
            } else if (dx > 0 && selectedDayOffset > 0) {
              selectDay(selectedDayOffset - 1);
            }
          }
        }
      }, { passive: true });

      navButtons.forEach((btn) => {
        if (btn.dataset.sign === currentSign) {
          btn.setAttribute('aria-current', 'page');
        } else {
          btn.removeAttribute('aria-current');
        }
      });
      renderWeekStrip();
      renderForecast();
    })();
</script>
